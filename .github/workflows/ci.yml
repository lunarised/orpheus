name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo +stable fmt --all --check
      - name: Run Clippy
        run: cargo +stable clippy --locked --all-targets

  test:
    name: Test and release build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Run tests
        run: cargo +stable test --locked --all-targets
      - name: Build desktop release
        run: cargo +stable build --locked --release

  hardware:
    name: Check Raspberry Pi build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Check hardware feature
        run: cargo +stable check --locked --release --no-default-features --features hardware --bins

